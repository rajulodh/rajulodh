<svg xmlns="http://www.w3.org/2000/svg" width="440" height="350" viewBox="0 0 440 350" role="img" aria-labelledby="t">
<title id="t">BlinxAI: AI-powered real-time chat application</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#101A38"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9C8FF"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <clipPath id="clip"><rect width="440" height="350" rx="22"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="440" height="350" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="79.2" cy="70.0" r="147.0" fill="#A78BFA" fill-opacity="0.30">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 40; -20 60; 0 0" dur="22s" repeatCount="indefinite"/></circle>
    <circle cx="360.79999999999995" cy="105.0" r="133.0" fill="#7C9CFF" fill-opacity="0.24">
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 30; 30 -30; 0 0" dur="26s" repeatCount="indefinite"/></circle>
    <circle cx="242.00000000000003" cy="332.5" r="119.00000000000001" fill="#5EEAD4" fill-opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 -30; -50 -10; 0 0" dur="30s" repeatCount="indefinite"/></circle>
  </g>
</g>
<rect x="12" y="12" width="416" height="326" rx="16" fill="url(#glass)" stroke="url(#edge)"/>
<g><animate attributeName="opacity" values="0;1" dur="0.7s" begin="0s" fill="freeze"/>
  <rect x="28" y="30" width="201" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.5"/>
  <text x="128.5" y="45" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1" fill="#A78BFA">REAL-TIME · MICROSERVICES</text>
  <text x="28" y="86" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#E8ECF8">BlinxAI</text>
  <text x="28" y="108" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#98A3C0">AI-powered real-time chat application</text>
  <line x1="28" y1="116" x2="412" y2="116" stroke="#FFFFFF" stroke-opacity="0.08"/>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.1765;1" dur="0.85s" begin="0s" fill="freeze"/><circle cx="34" cy="142" r="2.5" fill="#A78BFA"/><text x="46" y="146" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">Microservices architecture with WebSocket messaging</text><text x="46" y="165" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">and AI chatbot responses.</text><circle cx="34" cy="185" r="2.5" fill="#A78BFA"/><text x="46" y="189" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">JWT-based authentication to secure user sessions.</text><circle cx="34" cy="209" r="2.5" fill="#A78BFA"/><text x="46" y="213" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">Containerized with Docker; deployed on Kubernetes</text><text x="46" y="232" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">and AWS.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3750;1" dur="0.80s" begin="0s" fill="freeze"/><rect x="28" y="280" width="70" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="63.0" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">Java 17</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4186;1" dur="0.86s" begin="0s" fill="freeze"/><rect x="105" y="280" width="97" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="153.5" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">Spring Boot</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4565;1" dur="0.92s" begin="0s" fill="freeze"/><rect x="209" y="280" width="83" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="250.5" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">WebSocket</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4898;1" dur="0.98s" begin="0s" fill="freeze"/><rect x="299" y="280" width="44" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="321.0" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">JWT</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5192;1" dur="1.04s" begin="0s" fill="freeze"/><rect x="28" y="311" width="64" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="60.0" y="326.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">Docker</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5455;1" dur="1.10s" begin="0s" fill="freeze"/><rect x="99" y="311" width="90" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="144.0" y="326.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">Kubernetes</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5690;1" dur="1.16s" begin="0s" fill="freeze"/><rect x="196" y="311" width="44" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="218.0" y="326.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">AWS</text></g>
</svg>