<svg xmlns="http://www.w3.org/2000/svg" width="440" height="350" viewBox="0 0 440 350" role="img" aria-labelledby="t">
<title id="t">TaskFlow: Workspace-based task and project management</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#101A38"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9C8FF"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <clipPath id="clip"><rect width="440" height="350" rx="22"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="440" height="350" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="79.2" cy="70.0" r="147.0" fill="#5EEAD4" fill-opacity="0.30">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 40; -20 60; 0 0" dur="22s" repeatCount="indefinite"/></circle>
    <circle cx="360.79999999999995" cy="105.0" r="133.0" fill="#7C9CFF" fill-opacity="0.24">
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 30; 30 -30; 0 0" dur="26s" repeatCount="indefinite"/></circle>
    <circle cx="242.00000000000003" cy="332.5" r="119.00000000000001" fill="#5EEAD4" fill-opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 -30; -50 -10; 0 0" dur="30s" repeatCount="indefinite"/></circle>
  </g>
</g>
<rect x="12" y="12" width="416" height="326" rx="16" fill="url(#glass)" stroke="url(#edge)"/>
<g><animate attributeName="opacity" values="0;1" dur="0.7s" begin="0s" fill="freeze"/>
  <rect x="28" y="30" width="145" height="22" rx="11" fill="#5EEAD4" fill-opacity="0.14" stroke="#5EEAD4" stroke-opacity="0.5"/>
  <text x="100.5" y="45" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1" fill="#5EEAD4">FULL-STACK · LIVE</text>
  <text x="28" y="86" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#E8ECF8">TaskFlow</text>
  <text x="28" y="108" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#98A3C0">Workspace-based task and project management</text>
  <line x1="28" y1="116" x2="412" y2="116" stroke="#FFFFFF" stroke-opacity="0.08"/>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.1765;1" dur="0.85s" begin="0s" fill="freeze"/><circle cx="34" cy="142" r="2.5" fill="#5EEAD4"/><text x="46" y="146" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">Workspaces with Owner / Admin / Member roles,</text><text x="46" y="165" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">tasks, subtasks, labels, comments and projects.</text><circle cx="34" cy="185" r="2.5" fill="#5EEAD4"/><text x="46" y="189" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">NestJS REST API on Prisma + PostgreSQL with</text><text x="46" y="208" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">DTO validation and a modular service layer.</text><circle cx="34" cy="228" r="2.5" fill="#5EEAD4"/><text x="46" y="232" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">Responsive Next.js + Tailwind UI built from reusable</text><text x="46" y="251" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D1E8">components, with dark and light themes.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3750;1" dur="0.80s" begin="0s" fill="freeze"/><rect x="28" y="280" width="70" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="63.0" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">Next.js</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4186;1" dur="0.86s" begin="0s" fill="freeze"/><rect x="105" y="280" width="90" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="150.0" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">TypeScript</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4565;1" dur="0.92s" begin="0s" fill="freeze"/><rect x="202" y="280" width="64" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="234.0" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">NestJS</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4898;1" dur="0.98s" begin="0s" fill="freeze"/><rect x="273" y="280" width="64" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="305.0" y="295.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">Prisma</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5192;1" dur="1.04s" begin="0s" fill="freeze"/><rect x="28" y="311" width="90" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="73.0" y="326.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">PostgreSQL</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5455;1" dur="1.10s" begin="0s" fill="freeze"/><rect x="125" y="311" width="77" height="24" rx="12.0" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="163.5" y="326.85" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#E8ECF8">Tailwind</text></g>
</svg>