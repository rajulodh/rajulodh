<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-labelledby="t">
<title id="t">How I work: build, test, document, improve</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#101A38"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9C8FF"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <clipPath id="clip"><rect width="900" height="120" rx="22"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="900" height="120" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="162.0" cy="24.0" r="50.4" fill="#7C9CFF" fill-opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 40; -20 60; 0 0" dur="22s" repeatCount="indefinite"/></circle>
    <circle cx="738.0" cy="36.0" r="45.6" fill="#A78BFA" fill-opacity="0.16">
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 30; 30 -30; 0 0" dur="26s" repeatCount="indefinite"/></circle>
    <circle cx="495.00000000000006" cy="114.0" r="40.800000000000004" fill="#5EEAD4" fill-opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 -30; -50 -10; 0 0" dur="30s" repeatCount="indefinite"/></circle>
  </g>
</g>
<line x1="219.0" y1="60" x2="245.0" y2="60" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite"/></line><line x1="437.0" y1="60" x2="463.0" y2="60" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite"/></line><line x1="655.0" y1="60" x2="681.0" y2="60" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite"/></line>

<g><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0s" fill="freeze"/>
  <rect x="33.0" y="26" width="180" height="68" rx="14" fill="url(#glass)" stroke="url(#edge)"/>
  <text x="51.0" y="52" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#7C9CFF">01</text>
  <text x="79.0" y="52" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8ECF8">Build</text>
  <text x="51.0" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#98A3C0">ship a small, useful version</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2500;1" dur="0.80s" begin="0s" fill="freeze"/>
  <rect x="251.0" y="26" width="180" height="68" rx="14" fill="url(#glass)" stroke="url(#edge)"/>
  <text x="269.0" y="52" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5EEAD4">02</text>
  <text x="297.0" y="52" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8ECF8">Test</text>
  <text x="269.0" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#98A3C0">automate what matters</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4000;1" dur="1.00s" begin="0s" fill="freeze"/>
  <rect x="469.0" y="26" width="180" height="68" rx="14" fill="url(#glass)" stroke="url(#edge)"/>
  <text x="487.0" y="52" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#A78BFA">03</text>
  <text x="515.0" y="52" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8ECF8">Document</text>
  <text x="487.0" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#98A3C0">READMEs people can follow</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5000;1" dur="1.20s" begin="0s" fill="freeze"/>
  <rect x="687.0" y="26" width="180" height="68" rx="14" fill="url(#glass)" stroke="url(#edge)"/>
  <text x="705.0" y="52" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#FBBF77">04</text>
  <text x="733.0" y="52" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8ECF8">Improve</text>
  <text x="705.0" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#98A3C0">refactor, measure, repeat</text></g>
</svg>